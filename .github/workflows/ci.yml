name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: cd worker && npx wrangler types
      - run: npx tsc -p worker/tsconfig.json
      - run: npx vitest run
      - run: npx tsx scripts/compile-contract.ts
      - run: npx hardhat test
